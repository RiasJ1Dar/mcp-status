[package]
name = "mcp-status"
version = "0.1.0"
edition = "2021"
description = "Windows tray app: live/dead status for local MCP servers"
license = "MIT"
repository = "https://github.com/RiasJ1Dar/mcp-status"
readme = "README.md"
keywords = ["mcp", "tray", "status", "cursor", "desktop"]
categories = ["gui", "os"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
ureq = { version = "2.12", default-features = true }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tray-icon = "0.19"
tao = "0.30"
winrt-notification = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
